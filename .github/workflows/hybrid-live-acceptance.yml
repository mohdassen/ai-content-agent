name: Virtual Studio Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'motion/src/studioAcceptance.tsx'
      - 'motion/src/root.tsx'
      - 'motion/package.json'
      - '.github/workflows/hybrid-live-acceptance.yml'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: motion
        run: npm install
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download transparent presenter master
        run: |
          mkdir -p motion/public
          curl --fail --location --retry 3 --output motion/public/presenter-transparent.webm 'https://resource2.heygen.ai/aws_pacific/avatar_tmp/15afa89079a5462cb016ee346d771ddf/c38deae1f9764a448074ed527ff63349.webm'
          test $(stat -c%s motion/public/presenter-transparent.webm) -gt 100000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,duration -of default=nw=1 motion/public/presenter-transparent.webm | tee /tmp/presenter-alpha.txt
      - name: Decode presenter alpha to RGBA PNG sequence
        run: |
          mkdir -p motion/public/presenter-alpha
          ffmpeg -y -i motion/public/presenter-transparent.webm -vf "fps=30,format=rgba" motion/public/presenter-alpha/frame-%04d.png
          test -s motion/public/presenter-alpha/frame-0001.png
          test $(find motion/public/presenter-alpha -name 'frame-*.png' | wc -l) -ge 180
      - name: Verify studio design contract
        run: |
          grep -q 'presenter-alpha/frame-' motion/src/studioAcceptance.tsx
          grep -q 'const Presenter' motion/src/studioAcceptance.tsx
          grep -q 'left:54' motion/src/studioAcceptance.tsx
          grep -q 'DataWall' motion/src/studioAcceptance.tsx
          grep -q 'LowerThird' motion/src/studioAcceptance.tsx
          grep -q '467' motion/src/studioAcceptance.tsx
          ! grep -q 'OffthreadVideo\|colorkey\|presenter-cutout.webm\|Pointer\|NO LEGACY TEMPLATE' motion/src/studioAcceptance.tsx
      - name: Render virtual studio acceptance
        working-directory: motion
        run: npm run render:studio
      - name: Extract QA frames only
        run: |
          mkdir -p motion/out/qa
          ffmpeg -y -ss 2 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-right-02.jpg
          ffmpeg -y -ss 4 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-right-04.jpg
          ffmpeg -y -ss 6 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-right-06.jpg
          test -s motion/out/qa/studio-right-04.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-alpha-png-qa
          path: |
            motion/out/studio-acceptance.mp4
            motion/out/qa/*.jpg
          retention-days: 7
      - name: Hold Telegram delivery pending visual acceptance
        run: echo 'Telegram delivery intentionally disabled until PNG-alpha QA is visually accepted.'
