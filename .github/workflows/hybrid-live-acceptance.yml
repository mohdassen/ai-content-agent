name: Virtual Studio Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'motion/src/studioAcceptance.tsx'
      - 'motion/src/root.tsx'
      - 'motion/package.json'
      - '.github/workflows/hybrid-live-acceptance.yml'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: motion
        run: npm install
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download clean 1080p presenter master
        run: |
          mkdir -p motion/public
          curl --fail --location --retry 3 --output motion/public/presenter-source.mp4 'https://files2.heygen.ai/aws_pacific/avatar_tmp/15afa89079a5462cb016ee346d771ddf/34ef91b2ab3647efba41ed9751692cad.mp4?Expires=1788438612&Signature=AA~RqPFfDEBvevtgaiYIYDxcX49Bd4ZZcsnscfxdP~otn2oZxSmjL~qrh~0vAwY~np3tUARwEt-2bICMOHx2yHtyjcstcX2gv8l0R17wsouUUhZKhlDZNJ7PMCSlyM2VrYXF3EYj~wY7mEOOwosV7KRugBgL-5FQVImdSl3ACsRy9mzUy5niNbk63NazPrc~Myt-vwh3sAyX4eeIlX-4IB41PcWgf~aB7MNPePeECj5y~LWB4wYPnEUXydiz-pkwg7ATANgvL5OaV5llJJbv8iOOW5GsloGlDV0MrRLptjpTYKUODTYmFLmr4~1JZtKOWyPL-6vGivq2ivZ2MR85TA__&Key-Pair-Id=K38HBHX5LX3X2H'
          test $(stat -c%s motion/public/presenter-source.mp4) -gt 100000
      - name: Create isolated presenter cutout
        run: |
          ffmpeg -y -i motion/public/presenter-source.mp4 \
            -vf "colorkey=0x020712:0.16:0.08,format=yuva420p" \
            -c:v libvpx-vp9 -b:v 0 -crf 20 -auto-alt-ref 0 -an motion/public/presenter-cutout.webm
          test $(stat -c%s motion/public/presenter-cutout.webm) -gt 100000
      - name: Verify studio design contract
        run: |
          grep -q 'presenter-cutout.webm' motion/src/studioAcceptance.tsx
          grep -q 'DataWall' motion/src/studioAcceptance.tsx
          grep -q 'LowerThird' motion/src/studioAcceptance.tsx
          grep -q '467' motion/src/studioAcceptance.tsx
          ! grep -q 'PRESENTER + INTERACTIVE DATA\|NO LEGACY TEMPLATE\|Pointer' motion/src/studioAcceptance.tsx
      - name: Render virtual studio acceptance
        working-directory: motion
        run: npm run render:studio
      - name: Extract QA frames only
        run: |
          mkdir -p motion/out/qa
          ffmpeg -y -ss 2 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-02.jpg
          ffmpeg -y -ss 5 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-05.jpg
          ffmpeg -y -ss 8 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/studio-08.jpg
          test -s motion/out/qa/studio-05.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-acceptance-qa
          path: |
            motion/out/studio-acceptance.mp4
            motion/out/qa/*.jpg
          retention-days: 7
      - name: Hold Telegram delivery pending visual acceptance
        run: echo 'Telegram delivery intentionally disabled until QA frame is visually accepted.'
