name: Motion Design Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'motion/**'
      - '.github/workflows/motion-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: motion/package.json
      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Install dependencies
        run: npm install
      - name: Render motion preview
        run: npm run render
      - name: Upload motion preview
        uses: actions/upload-artifact@v4
        with:
          name: behind-the-number-motion-preview
          path: motion/out/behind-the-number-motion.mp4
          retention-days: 7
