name: Produce Content Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python produce.py
      - uses: actions/upload-artifact@v4
        with:
          name: behind-the-number-content-package
          path: data/output/
          retention-days: 14
