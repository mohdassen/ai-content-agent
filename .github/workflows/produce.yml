name: Produce First Reel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'produce.py'
      - 'src/**'
      - 'data/seeds/**'
      - 'requirements.txt'
      - '.github/workflows/produce.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Produce narrated reel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python produce.py
      - name: Upload reel package
        uses: actions/upload-artifact@v4
        with:
          name: behind-the-number-first-reel
          path: data/output/
          retention-days: 14
