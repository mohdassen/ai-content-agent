name: Master Explainer Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'motion/src/masterExplainer.tsx'
      - 'motion/src/root.tsx'
      - 'motion/package.json'
      - '.github/workflows/master-explainer.yml'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: motion
        run: npm install
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download 69s episode presenter master
        run: |
          mkdir -p motion/public motion/out/qa
          curl --fail --location --retry 3 --output motion/public/presenter-master.mp4 'https://files2.heygen.ai/aws_pacific/avatar_tmp/15afa89079a5462cb016ee346d771ddf/vc565526714a945ebb45d77238e2bc142/166e4eb1136b4dcca16c4331436cd6c2.mp4?Expires=1788462334&Signature=ki4jju34HhEadv9-2685L64hehjA6kyc4hmg69G5wwiNDUmXEJiVvXTp-c2xKxjS1YcRnJNswgrPPC~XdFvTse0yOYsd5-PQ5J3VDni95Xgt~lLIHsnuKMwtlVpg~zaZIG4Z6TNlKMxfWjppwis1fC9DYvT0d-Tgs3MDPUsgjEtCllBZRbcV0XBkOol6kHNdheDTJ0uokh6eOB6qMd6DyfqdeNUoWkSZEjaA4sHLSNtVGjABZ-V1hhDb87hBqHfDdruiFOeaYADQFNjflSgsy0NcJMhA8QdB5dL1WkU9DuHkrSRQ9h4GeHTHbMEERVd-QFFCuUW9RBhkm7rCuIbzLA__&Key-Pair-Id=K38HBHX5LX3X2H'
          test $(stat -c%s motion/public/presenter-master.mp4) -gt 100000
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 motion/public/presenter-master.mp4 | tee /tmp/source-audio.txt
          grep -q 'codec_name=' /tmp/source-audio.txt
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 motion/public/presenter-master.mp4)
          echo "Source duration: $duration"
          awk -v d="$duration" 'BEGIN { exit !(d > 65 && d < 72) }'
      - name: Render full episode
        working-directory: motion
        run: npm run render:master
      - name: Master narration audio
        run: |
          ffmpeg -y -i motion/out/master-explainer.mp4 \
            -map 0:v:0 -map 0:a:0 -c:v copy \
            -af "highpass=f=70,lowpass=f=15500,acompressor=threshold=-18dB:ratio=2.2:attack=18:release=180:makeup=1.5,loudnorm=I=-16:LRA=7:TP=-1.5" \
            -c:a aac -b:a 192k motion/out/master-explainer-polished.mp4
          mv motion/out/master-explainer-polished.mp4 motion/out/master-explainer.mp4
      - name: Duration and Audio QA
        run: |
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of default=nw=1 motion/out/master-explainer.mp4 | tee /tmp/final-audio.txt
          grep -q 'codec_name=' /tmp/final-audio.txt
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 motion/out/master-explainer.mp4)
          echo "Final duration: $duration"
          awk -v d="$duration" 'BEGIN { exit !(d > 65 && d < 72) }'
      - name: Visual QA frames
        run: |
          for t in 4 12 22 34 46 58 67; do ffmpeg -y -ss "$t" -i motion/out/master-explainer.mp4 -frames:v 1 "motion/out/qa/master-${t}.jpg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: full-episode-01
          path: |
            motion/out/master-explainer.mp4
            motion/out/qa/*.jpg
          retention-days: 7
      - name: Send full episode to Telegram and verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          response=$(curl --fail --silent --show-error \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F video=@motion/out/master-explainer.mp4 \
            -F caption='خلف الرقم — الحلقة الأولى | FULL 69s MASTER' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo")
          echo "$response" > /tmp/telegram-response.json
          grep -q '"ok":true' /tmp/telegram-response.json
          grep -q '"message_id":' /tmp/telegram-response.json
