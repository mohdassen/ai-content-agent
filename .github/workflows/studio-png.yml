name: Studio Green Key Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-png.yml'
      - 'motion/src/studioAcceptance.tsx'
      - 'motion/src/root.tsx'
      - 'motion/package.json'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: motion
        run: npm install
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download HeyGen green-screen presenter
        run: |
          mkdir -p motion/public/presenter-alpha
          curl --fail --location --retry 3 --output /tmp/presenter-green.mp4 'https://files2.heygen.ai/aws_pacific/avatar_tmp/15afa89079a5462cb016ee346d771ddf/388ea2ed56ed48e9b69f11cb8d1e5a62.mp4?Expires=1788452441&Signature=XEamR-HbYPv3xCANOgvWko0Z9PLGd9yEYFAavY3-FuxSe2aoxYjDnVt8~OMeGjcFqAortiWkWuCgSl8Gerf0K09EB-ikjARFbsd6tby7piZ58PPmgzEzot1LAsIIQW~6coYPvVtuIQw2HGjb1F6eulCJBmLgF1pYc0D4RX35mlyNozCAwLAHo18QoR0pYRWXZrxWXn3H31EaSkTuoG218SpOK9cUYp3YaydB358nv6rE5xhQYov45ib23N77XG44howwcWc8TjogCh0W6zpta0afajHps5wlpPGhz-fcN3fta5OfeoLbSlTTJH4tEAFTFfcWnzMHMjTSBK0CehHZXQ__&Key-Pair-Id=K38HBHX5LX3X2H'
          test $(stat -c%s /tmp/presenter-green.mp4) -gt 100000
      - name: Chroma-key green to RGBA PNG frames
        run: |
          ffmpeg -y -i /tmp/presenter-green.mp4 -vf "fps=30,colorkey=0x00FF00:0.26:0.10,format=rgba" motion/public/presenter-alpha/frame-%04d.png
          COUNT=$(find motion/public/presenter-alpha -name 'frame-*.png' | wc -l)
          echo "green-key frames=$COUNT"
          test "$COUNT" -ge 140
      - name: Verify studio source
        run: |
          grep -q 'presenter-alpha/frame-' motion/src/studioAcceptance.tsx
          grep -q 'right:-12' motion/src/studioAcceptance.tsx
          grep -q 'left:42' motion/src/studioAcceptance.tsx
          grep -q 'Math.min(147' motion/src/studioAcceptance.tsx
          ! grep -q 'LowerThird' motion/src/studioAcceptance.tsx
      - name: Render studio
        working-directory: motion
        run: npm run render:studio
      - name: Extract QA frames
        run: |
          mkdir -p motion/out/qa
          ffmpeg -y -ss 1 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/green-01.jpg
          ffmpeg -y -ss 3 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/green-03.jpg
          ffmpeg -y -ss 4.5 -i motion/out/studio-acceptance.mp4 -frames:v 1 motion/out/qa/green-045.jpg
          test -s motion/out/qa/green-03.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: studio-green-key-preview
          path: |
            motion/out/studio-acceptance.mp4
            motion/out/qa/*.jpg
          retention-days: 7
      - name: Send green-key preview to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail --silent --show-error \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F video=@motion/out/studio-acceptance.mp4 \
              -F caption='STUDIO REBALANCE — presenter right / infographic left / blended edges' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo"
          fi
